<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
<title id="t">How Orbit works</title>
<desc id="d">Press Option-Space to open Orbit. Typing shows instant local results for apps, files and contacts. Asking Orbit sends the question to the assistant, which talks to the language model you choose and uses tools on your Mac; actions with consequences wait for your confirmation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2A2470"/><stop offset="0.5" stop-color="#1B1950"/><stop offset="1" stop-color="#0D1238"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.12" cy="0.05" r="0.6">
    <stop offset="0" stop-color="#9F8CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#9F8CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="planet" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#FFE8B0"/><stop offset="0.3" stop-color="#FFB85C"/><stop offset="0.65" stop-color="#F4743B"/><stop offset="1" stop-color="#B63A1B"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7B6CF0"/><stop offset="1" stop-color="#5B4BD6"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A5B4FC"/>
  </marker>
</defs>
