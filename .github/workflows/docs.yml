# Builds the documentation site from docs/ with MkDocs and Material for MkDocs
# (see mkdocs.yml) and publishes it on GitHub Pages.
#
# It runs on pushes to main that change the docs, and by hand. Pull requests that
# change the docs only build the site, so a broken link or anchor fails the check.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub
# Actions". The site then appears at https://<owner>.github.io/<repository>/.
# See docs/development.md ("Documentation site").
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Mermaid ships with the site, so readers' browsers make no requests to a CDN.
  # To update it, set the version and the SHA-256 of its npm tarball:
  #   curl -fsSL https://registry.npmjs.org/mermaid/-/mermaid-<version>.tgz | shasum -a 256
  # Stay on the major version that Material for MkDocs expects (11).
  MERMAID_VERSION: "11.17.2"
  MERMAID_SHA256: "6ad2f42c3fc26bbf9e45cbb6d11898972573ea52b33a5f4ff51952899f950ffd"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/.site/requirements.txt

      - name: Install MkDocs
        run: python -m pip install -r docs/.site/requirements.txt

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_NAME: ${{ github.repository }}
          DOCS_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Links and the edit button point at this repository; the site URL is the
          # one GitHub Pages reports (not known for pull requests).
          if [[ -n "$BASE_URL" ]]; then export SITE_URL="${BASE_URL%/}/"; fi
          mkdocs build --strict

      - name: Bundle Mermaid
        if: github.event_name != 'pull_request'
        run: |
          # mkdocs.yml loads assets/javascripts/mermaid.min.js; it goes straight into the
          # built site, so docs/ never holds third-party code.
          curl -fsSL --retry 3 "https://registry.npmjs.org/mermaid/-/mermaid-${MERMAID_VERSION}.tgz" -o "$RUNNER_TEMP/mermaid.tgz"
          echo "${MERMAID_SHA256}  $RUNNER_TEMP/mermaid.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mermaid.tgz" -C "$RUNNER_TEMP" package/dist/mermaid.min.js
          mkdir -p site/assets/javascripts
          mv "$RUNNER_TEMP/package/dist/mermaid.min.js" site/assets/javascripts/mermaid.min.js

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
