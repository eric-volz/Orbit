# Publishes a GitHub release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0      (v0.2.0-beta.1 makes a prerelease)
#
# The job runs the unit tests, builds a universal release build and creates the
# release with the version's section of CHANGELOG.md as its notes. With the
# Developer ID secrets set, the build is signed and notarized, and the release
# gets Orbit-<version>.zip and its SHA-256 checksum. Without them (the current
# setup) the release is source only, because ad hoc builds are not distributed:
# its notes explain how to build Orbit from the tag. See docs/releasing.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number counts the commits
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag (expected v1.2.3, or v1.2.3-beta.1 for a prerelease)"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ -n "${BASH_REMATCH[1]}" ]] && prerelease=true
          build="$(git rev-list --count HEAD)"
          notes="$RUNNER_TEMP/release-notes.md"

          # The notes are the CHANGELOG.md section headed "## <version>" (the
          # heading may go on, as in "## 0.1.0 (2026-10-05)").
          awk -v version="$version" '
            /^## / {
              if (found) exit
              heading = $2
              gsub(/\[|\]/, "", heading)
              if (heading == version) { found = 1; next }
            }
            found
          ' CHANGELOG.md | perl -0777 -pe 's/\A\s+//; s/\s+\z/\n/' > "$notes"
          if [[ ! -s "$notes" ]]; then
            if [[ "$prerelease" == true ]]; then
              echo "::notice::CHANGELOG.md has no section for $version; GitHub generates the notes."
            else
              echo "::error::CHANGELOG.md has no section \"## $version\". Add one, then move the tag: git tag -f $TAG && git push -f origin $TAG"
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "build=$build"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Orbit $version (build $build), prerelease: $prerelease"

      - name: Check the signing secrets
        id: signing
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=()
          for name in DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif (( ${#missing[@]} == 5 )); then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID secrets are set: the release is source only, and its notes explain how to build Orbit."
          else
            echo "::error::Some signing secrets are missing: ${missing[*]}. Set all five or none."
            exit 1
          fi

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n 1 || true)"
          [[ -n "$xcode" ]] || { echo "::error::no Xcode found in /Applications"; exit 1; }
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      # Serially: on the runner's three cores, parallel @MainActor suites starve
      # one another, and tests that wait a few seconds for a result time out.
      - name: Run the unit tests
        id: tests
        run: Scripts/swiftpm.sh test --no-parallel 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      # GitHub shows a job's log only to signed-in users. The failures also go into
      # an annotation, which the run's page and the checks API show to everyone.
      - name: Report the failed tests
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          failures="$(grep -E '(^|: )error: |recorded an issue at|Fatal error|Test run with' "$RUNNER_TEMP/unit-tests.log" \
            | head -n 40 || true)"
          [[ -n "$failures" ]] || failures="No failed test in the output; see the log of the step above."
          printf '### Failed unit tests\n\n```\n%s\n```\n' "$failures" >> "$GITHUB_STEP_SUMMARY"
          # One annotation; a workflow command escapes %, CR and LF.
          printf '%s' "$failures" \
            | perl -0777 -ne 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; print "::error title=Unit tests failed::$_\n"'

      - name: Set up the Developer ID certificate and notary credentials
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)

          # Apple's intermediate certificates, in case the runner lacks them.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" > /dev/null 2>&1 || true
          done

          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE holds no valid Developer ID Application identity"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi

          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          xcrun notarytool store-credentials orbit-notary --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          rm -f "$key"

          {
            echo "ORBIT_SIGN_IDENTITY=$identity"
            echo "ORBIT_NOTARY_PROFILE=orbit-notary"
          } >> "$GITHUB_ENV"

      - name: Build Orbit.app
        env:
          ORBIT_VERSION: ${{ steps.version.outputs.version }}
          ORBIT_BUILD: ${{ steps.version.outputs.build }}
        run: Scripts/build-app.sh release --universal

      - name: Notarize
        if: steps.signing.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Scripts/notarize.sh
          cd build/release
          shasum -a 256 "Orbit-$VERSION.zip" > "Orbit-$VERSION.zip.sha256"
          cat "Orbit-$VERSION.zip.sha256"

      - name: Keep the debug symbols
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-${{ steps.version.outputs.version }}.dSYM
          path: build/release/Orbit.app.dSYM
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          assets=()
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$SIGNED" == true ]]; then
            assets=("build/release/Orbit-$VERSION.zip" "build/release/Orbit-$VERSION.zip.sha256")
          fi

          # A release made in GitHub's web interface pushes its tag, too: then
          # only the files are added and the notes stay as written there.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists already; adding the files only."
            if (( ${#assets[@]} )); then
              gh release upload "$TAG" "${assets[@]}" --clobber
            fi
          else
            flags=(--title "Orbit $VERSION" --verify-tag)
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            fi
            if [[ ! -s "$notes" ]]; then
              flags+=(--generate-notes) # appended after the notes file, if any
            fi
            if [[ "$SIGNED" != true ]]; then
              # Source only: say how to build exactly this version.
              if [[ -s "$notes" ]]; then
                printf '\n' >> "$notes"
              fi
              sed -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$GITHUB_SERVER_URL/$GH_REPO|g" >> "$notes" <<'EOF'
          ### Installing

          This release has no prebuilt app; you build Orbit from source. Orbit runs on macOS 14 or later; to build it
          you need macOS 15.2 or later and the Command Line Tools (`xcode-select --install`) or Xcode 16.3 or later.

          ```sh
          git clone --branch @TAG@ @REPO@.git &&
          cd Orbit &&
          Scripts/build-app.sh release &&
          cp -R build/release/Orbit.app /Applications/ &&
          open /Applications/Orbit.app
          ```

          [Getting started](@REPO@/blob/@TAG@/docs/getting-started.md#building-from-source) explains each step,
          and [Updating](@REPO@/blob/@TAG@/docs/getting-started.md#updating) how to replace an older copy.
          EOF
            fi
            if [[ -s "$notes" ]]; then
              # GitHub shows every line break in release notes, so the lines of each
              # paragraph and list item are joined. Headings, block quotes, tables
              # with leading pipes, fenced code blocks and new list items stay as they
              # are (docs/releasing.md lists what else a section should avoid).
              perl -e '
                my ($fence, @out) = (0);
                while (my $line = <STDIN>) {
                  $line =~ s/\r?\n\z//;
                  if ($line =~ /^\s*(```|~~~)/) { $fence = !$fence; push @out, $line; next }
                  if (!$fence && @out && $out[-1] =~ /\S/ && $line =~ /\S/
                      && $out[-1] !~ /^\s*(#|\||```|~~~)/ && $line !~ /^\s*([-*+] |\d+[.)] |#|>|\|)/) {
                    $line =~ s/^\s+//;
                    $out[-1] .= " $line";
                    next;
                  }
                  push @out, $line;
                }
                print "$_\n" for @out;
              ' < "$notes" > "$notes.joined"
              mv "$notes.joined" "$notes"
              flags+=(--notes-file "$notes")
            fi
            gh release create "$TAG" ${assets[@]+"${assets[@]}"} "${flags[@]}"
          fi

          {
            echo "### Orbit $VERSION"
            echo
            if [[ "$SIGNED" == true ]]; then
              echo "Notarized universal build attached: \`Orbit-$VERSION.zip\` and its checksum."
            else
              echo "Source only release (no Developer ID secrets); the notes explain how to build it."
            fi
            echo
            echo "https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
